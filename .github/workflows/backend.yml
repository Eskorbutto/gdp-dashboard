name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # Credenciales solo para la base efímera de CI.
          POSTGRES_USER: cc_owner
          POSTGRES_PASSWORD: cc_owner
          POSTGRES_DB: callcenter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Crear rol de aplicación (sin privilegios)
        env:
          PGPASSWORD: cc_owner
        run: |
          psql -h localhost -U cc_owner -d callcenter_test -c "CREATE ROLE cc_app LOGIN PASSWORD 'cc_app';"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
